# Render Blueprint for the CleanSlate metadata API.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file, builds backend/Dockerfile and creates a Free web
# service with the environment below. The SECRET_KEY is generated by Render
# (generateValue) so no secret ever lives in the repository.
#
# Free-plan facts that shape this configuration (verified 2026-10, see
# docs/DEPLOYMENT.md for sources):
#   * 750 Free instance hours per workspace per month
#   * the service spins down after 15 minutes without inbound traffic and takes
#     about a minute to wake up again
#   * the filesystem is ephemeral - which is exactly what this API wants, since
#     it must never persist uploads
#   * Free web services cannot attach persistent disks and have no shell access
services:
  - type: web
    name: cleanslate-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Exact frontend origins. Replace with your own *.pages.dev origin(s) and
      # keep the preview origin only if you plan to test previews against the
      # deployed API. Wildcards are rejected at startup by design.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Deliberately conservative for a 512 MB / 0.1 CPU free instance: one job
      # at a time and a small scratch budget so a burst of uploads cannot fill
      # the ephemeral disk or starve the single vCPU.
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_TEMP_BYTES
        value: "67108864"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: JOB_TTL_SECONDS
        value: "300"
      - key: DOWNLOAD_TOKEN_TTL_SECONDS
        value: "300"
      - key: DOWNLOAD_BIND_IP
        value: "true"
      - key: EXIFTOOL_TIMEOUT_SECONDS
        value: "20"
      - key: QPDF_TIMEOUT_SECONDS
        value: "20"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: ENABLE_HSTS
        value: "true"
      # Render terminates TLS and forwards the client address in
      # X-Forwarded-For. Enable this only because the service sits behind
      # Render's own proxy; never enable it on a directly exposed process.
      - key: TRUST_PROXY_HEADERS
        value: "true"
